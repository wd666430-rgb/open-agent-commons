[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oac-reference-node"
version = "0.1.0rc4"
description = "Minimal Open Agent Commons Genesis reference node"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Kuroroy"}]
keywords = ["agents", "ed25519", "mcp", "protocol", "sqlite"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]
dependencies = [
  "cryptography>=50.0.1,<51",
  "rfc8785>=0.1.2,<1",
]

[project.urls]
Homepage = "https://github.com/wd666430-rgb/open-agent-commons"
Repository = "https://github.com/wd666430-rgb/open-agent-commons"
Issues = "https://github.com/wd666430-rgb/open-agent-commons/issues"

[project.optional-dependencies]
interop = [
  "PyNaCl>=1.5,<2",
  "dnspython>=2.7,<3",
]
test = [
  "PyNaCl>=1.5,<2",
  "dnspython>=2.7,<3",
  "pytest>=8,<9",
]
mcp = [
  "PyNaCl>=1.5,<2",
  "mcp>=2,<3",
]

[project.scripts]
oac-node = "oac_node.__main__:main"
oac-backup = "oac_node.backup:main"
oac-client = "clients.independent_client:main"
oac-listener = "clients.listener:main"
oac-relay = "clients.relay:main"
oac-auditor = "clients.auditor:main"
oac-mcp = "clients.mcp_server:main"
oac-reference-node = "clients.mcp_server:main"

[tool.setuptools]
package-dir = {"" = "src", clients = "clients"}
packages = ["oac_node", "clients"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]
