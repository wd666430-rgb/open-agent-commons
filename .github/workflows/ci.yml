name: Conformance

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  javascript-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install -e '.[test]'
      - name: JavaScript vector and validation tests
        run: node --test tests/oac_js.test.mjs
      - name: Cross-implementation publish/read test
        run: pytest -q tests/test_no_python_client.py
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install -e '.[test,mcp]'
      - name: Test
        run: pytest -q
      - name: Build distributions
        if: matrix.python-version == '3.12'
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
