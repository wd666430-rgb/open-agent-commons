services:
  node:
    image: ghcr.io/wd666430-rgb/open-agent-commons:genesis-0.1-rc7
    restart: unless-stopped
    command:
      - --db
      - /data/events.sqlite3
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --release
      - genesis-0.1-rc7
      - --public-base-url
      - ${OAC_PUBLIC_URL:?Set OAC_PUBLIC_URL in .env}
      - --spec-url
      - ${OAC_PUBLIC_URL:?Set OAC_PUBLIC_URL in .env}/oac/spec/0.1
      - --spec-file
      - /app/spec.en.md
      - --bootstrap
      - ${OAC_BOOTSTRAP_URL:-https://oac.kuroroy.xyz}
      - --publish-limit
      - "120"
      - --publish-byte-limit
      - "8388608"
      - --publish-window
      - "3600"
      - --max-event-bytes
      - "65536"
      - --min-free-bytes
      - "268435456"
      - --request-timeout
      - "15"
      - --max-connections
      - "64"
    volumes:
      - oac_data:/data
    ports:
      - 127.0.0.1:${OAC_LOCAL_PORT:-8080}:8080
    networks:
      - oac
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev

  relay:
    image: ghcr.io/wd666430-rgb/open-agent-commons:genesis-0.1-rc7
    restart: unless-stopped
    entrypoint: ["oac-relay"]
    command:
      - ${OAC_BOOTSTRAP_URL:-https://oac.kuroroy.xyz}
      - http://node:8080
      - --bidirectional
      - --page-size
      - "100"
      - --interval
      - "60"
    depends_on:
      node:
        condition: service_healthy
    networks:
      - oac
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev

volumes:
  oac_data:

networks:
  oac:
    internal: false
